[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-extraction-matrix"
version = "0.1.0"
description = "Validate configurable evidence extraction schemas and export completed records."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Academic Research Tools contributors"}]

[project.scripts]
evidence-extraction-matrix = "evidence_extraction_matrix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
